<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="logoutModal" id="logoutModal" 
     style="display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
    <div style="background-color: white; margin: 15% auto; padding: 30px; border-radius: 8px; width: 420px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
        <h3 style="margin-bottom: 10px;">Confirm Logout</h3>
        <p style="margin-bottom: 25px;">Are you sure you want to log out?</p>
        <div style="display: flex; justify-content: center; gap: 15px;">
            <button onclick="confirmLogout()"
                style="padding: 10px 25px; background-color: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">
                Logout
            </button>
            <button onclick="closeLogoutModal()"
                style="padding: 10px 25px; background-color: #30534D; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">
                Cancel
            </button>
        </div>
    </div>
</div>
</body>
</html>
