<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Brgy. San Sebastian Program Calendar: Manage Program Calendar">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" href="/css/program-calendar.css">

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <title>Program Calendar</title>
</head>
<body>
    <input type="hidden" id="dataCurrentRole" th:value="${currentrole}">
    <input type="hidden" id="currentUserName" th:value="${currentUser}">
    <script src="/js/notif.js"></script>
    <div class="toast-container" id="toastContainer"></div>

    <!-- PURE CSS ALERT OVERLAYS -->

    <!-- Success Overlay -->
    <div class="sys-overlay" id="sysSuccessOverlay">
        <div class="sys-modal-box success">
            <div class="sys-modal-body">
                <div class="sys-modal-icon"><i class="bi bi-check-circle-fill"></i></div>
                <h5 id="sysSuccessMessage">Success!</h5>
            </div>
            <div class="sys-modal-footer">
                <button class="sys-btn-ok" id="sysSuccessOkBtn">OK</button>
            </div>
        </div>
    </div>

    <!-- Error Overlay -->
    <div class="sys-overlay" id="sysErrorOverlay">
        <div class="sys-modal-box error">
            <div class="sys-modal-body">
                <div class="sys-modal-icon"><i class="bi bi-x-circle-fill"></i></div>
                <h5 id="sysErrorMessage">An error occurred.</h5>
            </div>
            <div class="sys-modal-footer">
                <button class="sys-btn-ok" id="sysErrorOkBtn">OK</button>
            </div>
        </div>
    </div>

    <!-- Confirm Overlay -->
    <div class="sys-overlay" id="sysConfirmOverlay">
        <div class="sys-modal-box confirm">
            <div class="sys-confirm-header">
                <h5 id="sysConfirmTitle">Confirm</h5>
                <button class="sys-confirm-close" id="sysConfirmCloseBtn">&times;</button>
            </div>
            <div class="sys-confirm-body">
                <p id="sysConfirmMessage" style="margin:0;"></p>
            </div>
            <div class="sys-confirm-footer">
                <button class="sys-btn-cancel" id="sysConfirmCancelBtn">Cancel</button>
                <button class="sys-btn-confirm" id="sysConfirmOkBtn">Confirm</button>
            </div>
        </div>
    </div>

    <div class="layout">
        <!-- Bootstrap Success Modal (kept for compatibility) -->
        <div class="modal fade success-toast-modal" id="successModal" tabindex="-1" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content">
                    <div class="modal-header border-0 pb-0"></div>
                    <div class="modal-body">
                        <div class="success-icon"><i class="bi bi-check-circle-fill"></i></div>
                        <h5 id="successMessage">Success!</h5>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">OK</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap Confirm Modal (kept for compatibility) -->
        <div class="modal fade confirm-modal" id="confirmationModal" tabindex="-1" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="confirmModalTitle">Confirm Action</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="confirmModalMessage" style="padding: 24px; font-size: 16px;">
                        Are you sure?
                    </div>
                    <div class="modal-footer" style="border-top: none; padding: 16px 24px;">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="confirmModalOkBtn" style="background-color: #44C375; border-color: #44C375;">Confirm</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="content">
            <div class="top-header">
                <div class="top-header-tab">Program Calendar</div>
            </div>

            <div class="panel" role="main">
                <!-- Calendar Main -->
                <div class="calendar-main">
                    <div class="calendar-nav">
                        <button class="calendar-nav-btn" id="nav-prev" aria-label="Previous"><i class="bi bi-chevron-left"></i></button>
                        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
                            <div class="calendar-month-title" id="calendar-title">March 2026</div>
                            <div class="view-toggle">
                                <button class="view-toggle-btn active" id="btn-month-view">Month</button>
                                <button class="view-toggle-btn" id="btn-year-view">Year</button>
                            </div>
                        </div>
                        <button class="calendar-nav-btn" id="nav-next" aria-label="Next"><i class="bi bi-chevron-right"></i></button>
                    </div>

                    <div class="calendar-grid" id="calendar-grid">
                        <div class="cal-day-name">Sun</div>
                        <div class="cal-day-name">Mon</div>
                        <div class="cal-day-name">Tue</div>
                        <div class="cal-day-name">Wed</div>
                        <div class="cal-day-name">Thu</div>
                        <div class="cal-day-name">Fri</div>
                        <div class="cal-day-name">Sat</div>
                    </div>

                    <!-- Year View -->
                    <div class="year-view" id="year-view" style="display:none;"></div>
                </div>

                <!-- Side Column -->
                <div class="side-column">
                    <!-- Upcoming Events -->
                    <div class="card-white upcoming-card">
                        <div class="card-title">
                            <span><i class="bi bi-calendar-event" style="margin-right:6px;"></i>Upcoming Events</span>
                            <button class="btn-green" id="btnOpenAddEvent" th:if="${currentrole == 'ADMIN' or currentrole == 'SECRETARY' or currentrole == 'SECRETARIAT STAFF'}">
                                <i class="bi bi-plus-circle"></i> Add
                            </button>
                        </div>
                        <div id="upcoming-events-list">
                            <div style="text-align: center; color: #aaa; font-size: 13px; padding: 20px 0;">
                                <i class="bi bi-calendar2-x" style="font-size: 24px; display: block; margin-bottom: 8px;"></i>
                                No upcoming events.
                            </div>
                        </div>
                    </div>

                    <!-- Settings & Export -->
                    <div class="card-white" style="flex-shrink: 0;">
                        <div class="card-title" style="border:none; margin-bottom: 0;">
                            <span><i class="bi bi-gear" style="margin-right:6px;"></i>Settings</span>
                        </div>
                        <div class="toggle-row">
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="notifToggle" checked>
                            </div>
                            <label for="notifToggle" style="cursor:pointer; font-size: 13px;">Notifications for upcoming programs</label>
                        </div>
                        <div class="export-row">
                            <button class="btn-yellow" id="btnExportPDF"><i class="bi bi-download"></i> Export PDF</button>
                            <select id="exportFormat" class="export-select" aria-label="Export format">
                                <option value="both">Both Calendar &amp; Events</option>
                                <option value="events">Events List Only</option>
                            </select>
                            <span style="font-size: 11px; color: #888;">Export as PDF</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Event Modal -->
    <div id="addEventModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="bi bi-calendar-plus"></i> Add New Event</h3>
                <button class="close-modal" id="closeAddEventModalBtn">&times;</button>
            </div>
            
            <div class="form-group">
                <label>Event Name</label>
                <input type="text" id="eventName" placeholder="e.g., Community Clean-up Drive">
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label>Date</label>
                    <input type="date" id="eventDate">
                </div>
                <div class="form-col">
                    <label>Location</label>
                    <input type="text" id="eventLocation" placeholder="e.g., Barangay Hall">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col">
                    <label>Start <span style="color:#e74c3c;">(7:00 AM - 10:00 PM)</span></label>
                    <input type="time" id="startTime">
                </div>
                <div class="form-col">
                    <label>End  <span style="color:#e74c3c;">(7:00 AM - 10:00 PM)</span></label>
                    <input type="time" id="endTime">
                </div>
            </div>
            <div id="timeError" style="color:#e74c3c; font-size:12px; margin-bottom:10px; display:none;"></div>
            
            <div class="form-group">
                <label>Estimated Budget (&#8369;)</label>
                <input type="number" id="eventBudget" placeholder="0" value="0">
                <div id="budgetError" style="color:#e74c3c; font-size:12px; margin-top:4px; display:none;"></div>
                <div style="font-size:11px; color:#888; margin-top:4px;">Maximum budget: <span id="maxBudgetDisplay">&#8369;0.00</span></div>
            </div>
            
            <div class="form-group">
                <label>Notes (Optional)</label>
                <textarea id="eventNotes" rows="2" placeholder="Additional details..."></textarea>
            </div>
            
            <div class="modal-buttons">
                <button class="btn-save" id="btnSaveEvent">
                    <i class="bi bi-check-circle"></i> Save Event
                </button>
                <button class="btn-cancel" id="btnCancelAddEvent">Cancel</button>
            </div>
        </div>
    </div>

    <!-- View Events Modal -->
    <div id="viewEventsModal" class="modal">
        <div class="modal-content wide-two-col">
            <div class="viewevents-col-left">
                <div class="modal-header">
                    <h3><i class="bi bi-calendar-date"></i> Events for <span id="viewEventsDate">-</span></h3>
                    <button class="close-modal" id="closeViewEventsModalBtn">&times;</button>
                </div>
                <div id="viewEventsList">
                    <div class="no-events">Loading...</div>
                </div>
                <div class="modal-buttons">
                    <button class="btn-green" id="btnAddEventOnDay" th:if="${currentrole == 'ADMIN' or currentrole == 'SECRETARY' or currentrole == 'SECRETARIAT STAFF'}">
                        <i class="bi bi-plus-circle"></i> Add Event on this Day
                    </button>
                    <button class="btn-cancel" id="btnCloseViewEvents">Close</button>
                </div>
            </div>
            <div class="viewevents-col-right">
                <div class="notes-panel-header">
                    <i class="bi bi-journal-text"></i> Notes
                </div>
                <div id="viewEventsNotesEventTag"></div>
                <div id="viewEventsNotesPanel">
                    <div class="notes-panel-empty">Select an event to view its notes.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Logout Modal -->
    <div th:insert="~{fragments/logout-modal :: logoutModal}"></div>
    
    <script src="/js/sidebar.js"></script>
    <script src="/js/program-calendar.js"></script>
</body>
</html>
