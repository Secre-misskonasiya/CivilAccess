<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Brgy. San Sebastian Resident Announcements: View latest announcements and updates from Barangay San Sebastian">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://upfrofppponiqffbssqb.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/sidebar2.css}">
    <link rel="stylesheet" href="/css/resident-announcements.css">

    <title>Announcements – CivilAccess</title>
</head>
<body>

<div class="layout">
    <div th:replace="~{fragments/sidebar2 :: sidebar}"></div>
    <div th:replace="~{fragments/sidebar2 :: logoutModal}"></div>
    <div th:replace="~{fragments/sidebar2 :: mobileToggle}"></div>

    <div class="content">
        <nav class="topnav">
            <a class="nav-brand" href="#">
                <div class="nav-icon"><i class="bi bi-building-fill"></i></div>
                <div>
                    <div class="nav-name">CivilAccess</div>
                    <div class="nav-sub">Barangay Portal</div>
                </div>
            </a>
            <div class="live-badge">
                <div class="dot"></div>
                Announcements
            </div>
        </nav>

        <main class="page">
            <div class="page-head">
                <h1>Barangay Announcements</h1>
                <p>Official notices and community news from your barangay.</p>
            </div>

            <div class="search-wrap">
                <i class="bi bi-search"></i>
                <input class="search-input" id="searchInput" type="text" placeholder="Search announcements…" aria-label="Search announcements">
            </div>

            <div class="chips">
                <div class="chip active" data-filter="all">All</div>
                <div class="chip chip-high" data-filter="HIGH"><i class="bi bi-pin-angle-fill"></i> Pinned</div>
                <div class="chip" data-filter="NORMAL">Normal</div>
            </div>

            <div id="feed">
                <th:block th:each="a, stat : ${announcements}">
                    <article th:id="'card-' + ${a.id}"
                             th:data-id="${a.id}"
                             th:data-priority="${a.priority != null ? #strings.toUpperCase(a.priority) : 'NORMAL'}"
                             th:data-title="${a.title}"
                             th:data-content="${a.content}"
                             th:data-date="${a.datePosted}"
                             th:data-image="${a.image != null ? a.image : ''}"
                             th:classappend="${a.priority != null and #strings.equalsIgnoreCase(a.priority, 'HIGH') ? 'card pinned' : 'card'}">

                        <div class="card-head">
                            <div class="avatar"><i class="bi bi-megaphone-fill"></i></div>
                            <div class="head-meta">
                                <div class="sender">Barangay Official</div>
                                <div class="post-dt"
                                     th:text="${a.datePosted != null ? #temporals.format(a.datePosted, 'MMMM d, yyyy · h:mm a') : 'N/A'}">
                                </div>
                            </div>
                            <span th:class="${a.priority != null and #strings.equalsIgnoreCase(a.priority, 'HIGH') ? 'badge badge-high' : 'badge badge-normal'}"
                                  th:text="${a.priority != null ? #strings.toUpperCase(a.priority) : 'NORMAL'}">
                            </span>
                        </div>

                        <div class="card-title" th:text="${a.title}"></div>

                        <div th:if="${a.content != null and not #strings.isEmpty(a.content)}">
                            <div th:class="${#strings.length(a.content) > 280 ? 'card-body clamped' : 'card-body'}"
                                 th:text="${a.content}">
                            </div>
                            <button th:if="${#strings.length(a.content) > 280}"
                                    class="read-more btn-open-modal"
                                    th:attr="data-card-id='card-' + ${a.id}">
                                Read more…
                            </button>
                        </div>

                        <img th:if="${a.image != null and not #strings.isEmpty(a.image)}"
                             class="card-img"
                             th:src="@{https://wsrv.nl/(url=${a.image},w=800,q=70,output='webp')}"
                             th:data-orig="${a.image}"
                             th:attr="loading=${stat.first ? 'eager' : 'lazy'}"
                             alt="Announcement image"
                             onerror="if(!this.dataset.f){this.dataset.f=1;this.src=this.dataset.orig;}else{this.style.display='none'}">
                        <div th:if="${a.image == null or #strings.isEmpty(a.image)}" class="no-img">
                            <i class="bi bi-image"></i>
                            <span>No image attached</span>
                        </div>

                        <div class="card-foot">
                            <div class="foot-left"></div>
                            <button class="view-btn btn-open-modal"
                                    th:attr="data-card-id='card-' + ${a.id}">
                                View full <i class="bi bi-arrow-right-short"></i>
                            </button>
                        </div>
                    </article>
                </th:block>

                <div class="empty" id="emptyState" style="display:none">
                    <i class="bi bi-megaphone"></i>
                    <p>No announcements match your search.</p>
                </div>

                <div class="empty" th:if="${announcements == null or #lists.isEmpty(announcements)}">
                    <i class="bi bi-megaphone"></i>
                    <p>No active announcements yet. Check back soon!</p>
                </div>
            </div>
        </main>

        <div class="overlay" id="overlay">
            <div class="modal-box" id="modalBox">
                <div class="modal-top">
                    <h2>Announcement</h2>
                    <button class="modal-x" id="btnCloseModal" aria-label="Close"><i class="bi bi-x-lg"></i></button>
                </div>
                <div id="modalContent"></div>
            </div>
        </div>
    </div>
</div>

<script src="/js/resident-announcements.js"></script>
<script src="/js/sidebar2.js"></script>
</body>
</html>
