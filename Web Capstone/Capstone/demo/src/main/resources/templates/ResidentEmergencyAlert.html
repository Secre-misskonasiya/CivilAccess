<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Alerts – CivilAccess</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" th:href="@{/css/sidebar.css}">   

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand-dark:  #2d4a44;
      --brand-mid:   #386660;
      --brand-light: #44c375;
      --gold:        #fed734;
      --bg:          #eaecef;
      --card:        #ffffff;
      --text-1:      #1c1e21;
      --text-2:      #65676b;
      --text-3:      #9ea3a8;
      --border:      #e4e6eb;
      --radius:      12px;
      --nav-h:       62px;
      --font-h:      'Sora', sans-serif;
      --font-b:      'Lato', sans-serif;
      
      --critical: #E35248;
      --warning: #F2A03D;
      --mild: #2D9CDB;
    }

    body {
      font-family: var(--font-b);
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
    }

    .topnav {
      position: sticky; top: 0; z-index: 100;
      height: var(--nav-h);
      background: var(--brand-dark);
      border-bottom: 3px solid var(--gold);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 2px 16px rgba(0,0,0,.22);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-icon {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(254,215,52,.15);
      border: 2px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      color: var(--gold); font-size: 18px;
    }
    .nav-name { font-family: var(--font-h); font-weight: 800; font-size: 19px; color: #fff; letter-spacing: -.3px; }
    .nav-sub  { font-size: 10px; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .7px; }
    .live-badge {
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      color: rgba(255,255,255,.85);
      padding: 6px 14px; border-radius: 40px;
      font-family: var(--font-h); font-size: 12px; font-weight: 600;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--brand-light);
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }

    .sub-nav {
      background: var(--brand-mid);
      padding: 12px 20px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .sub-tab {
      padding: 8px 24px;
      border-radius: 40px;
      background: rgba(255,255,255,0.15);
      color: white;
      font-family: var(--font-h);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sub-tab i { font-size: 16px; }
    .sub-tab.active {
      background: white;
      color: var(--brand-dark);
    }
    .sub-tab:hover:not(.active) { background: rgba(255,255,255,0.25); }

    .page { max-width: 660px; margin: 0 auto; padding: 20px 14px 64px; }

    .weather-header {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 1px 6px rgba(0,0,0,.07);
    }
    .weather-temp { font-size: 48px; font-weight: 700; color: var(--brand-dark); font-family: var(--font-h); }
    .weather-loc { font-size: 12px; color: var(--text-3); text-transform: uppercase; margin-top: 4px; }
    .weather-icon { font-size: 48px; color: var(--brand-mid); margin-bottom: 8px; }

    .weekly-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,.07);
    }
    .weekly-title { font-family: var(--font-h); font-weight: 700; font-size: 16px; color: var(--brand-dark); text-align: center; margin-bottom: 16px; }
    .forecast-day { border-bottom: 1px solid var(--border); padding: 12px 0; cursor: pointer; }
    .forecast-day:last-child { border-bottom: none; }
    .forecast-header { display: flex; align-items: center; justify-content: space-between; }
    .day-info { flex: 2; }
    .day-name { font-weight: 700; font-size: 14px; color: var(--text-1); }
    .day-date { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .weather-icon-small { font-size: 28px; color: var(--brand-mid); }
    .temp-range { display: flex; gap: 8px; margin-right: 12px; }
    .temp-max { font-weight: 700; color: var(--critical); }
    .temp-min { color: var(--mild); }
    .forecast-details { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .detail-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--text-2); }

    .section-title { font-family: var(--font-h); font-weight: 700; font-size: 18px; color: var(--brand-dark); margin: 16px 0 8px; }
    .title-underline { width: 50px; height: 3px; background: var(--brand-mid); border-radius: 3px; margin-bottom: 16px; }

    #feed { display: flex; flex-direction: column; gap: 16px; }

    .alert-card {
      border-radius: 20px;
      padding: 20px;
      color: white;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .alert-card:hover { transform: translateY(-2px); }
    .alert-card.critical { background: var(--critical); }
    .alert-card.warning { background: var(--warning); }
    .alert-card.mild { background: var(--mild); }

    .alert-icon { text-align: center; margin-bottom: 12px; }
    .alert-icon i { font-size: 48px; background: white; width: 70px; height: 70px; line-height: 70px; border-radius: 50%; display: inline-block; }
    .alert-card.critical .alert-icon i { color: var(--critical); }
    .alert-card.warning .alert-icon i { color: var(--warning); }
    .alert-card.mild .alert-icon i { color: var(--mild); }

    .alert-type { text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 8px; opacity: 0.85; }
    .alert-title { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .alert-message { text-align: center; font-size: 13px; line-height: 1.5; opacity: 0.95; }
    .alert-footer { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.2); font-size: 11px; }

    .road-card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,.07);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .road-card:hover { transform: translateY(-2px); }
    .road-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .road-badge { background: var(--gold); padding: 4px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; color: var(--brand-dark); }
    .road-time { font-size: 11px; color: var(--text-3); }
    .road-title { font-size: 16px; font-weight: 700; color: var(--text-1); margin-bottom: 6px; }
    .road-message { font-size: 13px; color: var(--text-2); line-height: 1.5; margin-bottom: 12px; }
    .road-location { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-3); padding-top: 10px; border-top: 1px solid var(--border); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-3); }
    .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }

    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
      z-index: 200; align-items: center; justify-content: center;
      padding: 20px;
    }
    .overlay.open { display: flex; }
    .modal-box {
      background: var(--card); border-radius: 16px;
      width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 24px 60px rgba(0,0,0,.3);
      animation: popIn .25s ease both;
    }
    @keyframes popIn {
      from { opacity:0; transform:scale(.95) translateY(10px); }
      to   { opacity:1; transform:scale(1)   translateY(0); }
    }
    .modal-top {
      background: var(--brand-dark); border-bottom: 3px solid var(--gold);
      padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0;
    }
    .modal-top h2 { font-family: var(--font-h); font-size: 15px; font-weight: 700; color: #fff; margin: 0; }
    .modal-x { background: none; border: none; color: rgba(255,255,255,.65); font-size: 22px; cursor: pointer; line-height: 1; }
    .modal-x:hover { color: #fff; }
    .modal-body-custom { padding: 20px; }
    .modal-location { display: flex; align-items: center; gap: 6px; margin: 12px 0; padding: 10px; background: #f5f5f5; border-radius: 8px; font-size: 13px; }
    .modal-map { height: 200px; border-radius: 8px; margin-top: 12px; overflow: hidden; }
    .modal-footer-custom { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
    .btn-close-m { padding: 8px 24px; background: var(--brand-dark); color: #fff; border: none; border-radius: 40px; font-family: var(--font-h); font-weight: 600; font-size: 13px; cursor: pointer; }
    .btn-close-m:hover { background: var(--brand-mid); }

    @media(max-width:480px){
      .page { padding: 16px 12px 48px; }
      .sub-tab { padding: 6px 16px; font-size: 12px; }
      .weather-temp { font-size: 36px; }
    }

     .layout {
  display: flex;
  height: 100vh;
 
}


.content {
  flex: 1;          
  min-width: 0;     
  overflow-y: auto; 
  overflow-x: hidden;
}

  </style>
</head>
<body>
<div class=" layout">
<div th:replace="~{fragments/sidebar2 :: sidebar}"></div>

<div class="content">

<nav class="topnav">
  <a class="nav-brand" href="#">
    <div class="nav-icon"><i class="bi bi-building-fill"></i></div>
    <div>
      <div class="nav-name">CivilAccess</div>
      <div class="nav-sub">Barangay Portal</div>
    </div>
  </a>
  <div class="live-badge">
    <div class="dot"></div>
    Emergency Alerts
  </div>
</nav>

<div class="sub-nav">
  <div class="sub-tab active" data-tab="alerts">
    <i class="bi bi-exclamation-triangle-fill"></i> Alerts
  </div>
  <div class="sub-tab" data-tab="road">
    <i class="bi bi-shield-shaded"></i> Public Safety
  </div>
  <div class="sub-tab" data-tab="weather">
    <i class="bi bi-cloud-lightning-rain"></i> Weather
  </div>
</div>

<main class="page" id="mainPage">

  <div id="weatherContent" style="display: none;">
    <div class="weather-header" id="weatherHeader">
      <div class="weather-icon"><i class="bi bi-cloud-sun"></i></div>
      <div class="weather-temp" id="currentTemp">--°C</div>
      <div class="weather-loc" id="currentLoc">San Sebastian, Kawit</div>
    </div>
    <div class="weekly-card" id="weeklyForecast">
      <div class="weekly-title">7-Day Forecast</div>
      <div id="forecastList"></div>
    </div>
  </div>

  <div id="alertsContent">
    <div class="section-title" id="activeSectionTitle">Emergency Alerts</div>
    <div class="title-underline"></div>
    <div id="feed">
      <!-- Thymeleaf initial render - these stay until polling detects changes -->
      <th:block th:each="alert : ${alerts}">
        <div th:if="${!alert.archived}" id="alert-${alert.id}" class="alert-card warning" 
             th:classappend="${alert.priority == 'Level 3' or alert.priority == 'CRITICAL' ? 'critical' : (alert.priority == 'Level 2' or alert.priority == 'WARNING' ? 'warning' : 'mild')}"
             th:attr="data-id=${alert.id}, data-title=${alert.title}, data-message=${alert.message}, data-type=${alert.type}, data-location=${alert.location}, data-latitude=${alert.latitude}, data-longitude=${alert.longitude}, data-priority=${alert.priority}, data-date=${alert.dateCreated}"
             onclick="openAlertModal(this)">
          <div class="alert-icon">
            <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
          <div class="alert-type">
            <span th:text="${alert.priority == 'Level 3' or alert.priority == 'CRITICAL' ? 'CRITICAL' : (alert.priority == 'Level 2' or alert.priority == 'WARNING' ? 'WARNING' : 'MILD')}"></span>
            <span th:text="' • ' + ${alert.type}"></span>
          </div>
          <div class="alert-title" th:text="${alert.title}"></div>
          <div class="alert-message" th:text="${alert.message}"></div>
          <div class="alert-footer">
            <i class="bi bi-geo-alt-fill"></i>
            <span th:text="${alert.location}"></span>
          </div>
        </div>
      </th:block>
    </div>
  </div>

  <div class="empty-state" id="emptyState" style="display: none;">
    <i class="bi bi-shield-check"></i>
    <p>No alerts at this time.</p>
  </div>

</main>

<div class="overlay" id="overlay" onclick="closeModalOnBg(event)">
  <div class="modal-box">
    <div class="modal-top">
      <h2>Alert Details</h2>
      <button class="modal-x" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

</div>

</div>

<script src="/js/sidebar2.js"></script>


<script>
  let currentTab = 'alerts';
  let currentMap = null;
  let lastEtag = '';

  function getPriorityClass(priority) {
    const p = priority ? priority.toString().toUpperCase() : '';
    if (p === 'LEVEL 3' || p === 'CRITICAL') return 'critical';
    if (p === 'LEVEL 2' || p === 'WARNING') return 'warning';
    return 'mild';
  }

  function getPriorityLabel(priority) {
    const p = priority ? priority.toString().toUpperCase() : '';
    if (p === 'LEVEL 3' || p === 'CRITICAL') return 'CRITICAL';
    if (p === 'LEVEL 2' || p === 'WARNING') return 'WARNING';
    return 'MILD';
  }

  function getPriorityIcon(priority) {
    const p = priority ? priority.toString().toUpperCase() : '';
    if (p === 'LEVEL 3' || p === 'CRITICAL') return 'bi bi-cloud-lightning-rain';
    if (p === 'LEVEL 2' || p === 'WARNING') return 'bi bi-cloud-rain-heavy';
    return 'bi bi-cloud';
  }

  // Function to collect current visible alert IDs from the DOM
  function getCurrentAlertIds() {
    const cards = document.querySelectorAll('#feed .alert-card');
    const ids = [];
    cards.forEach(card => {
      const id = card.getAttribute('data-id');
      if (id) ids.push(id);
    });
    return ids;
  }

  // Poll for updates - only reload if data changed
  async function pollAlerts() {
    if (currentTab === 'weather') return;
    
    try {
      const res = await fetch('/resident/emergency-alerts/api/feed?t=' + Date.now());
      if (!res.ok) return;
      const data = await res.json();
      
      // Filter out archived alerts
      const activeAlerts = data.filter(a => !a.archived);
      
      // Get current alert IDs from the page
      const currentIds = getCurrentAlertIds();
      const newIds = activeAlerts.map(a => a.id);
      
      // Check if IDs have changed
      const idsChanged = currentIds.length !== newIds.length || 
                        currentIds.some(id => !newIds.includes(id)) ||
                        newIds.some(id => !currentIds.includes(id));
      
      if (!idsChanged) {
        // Also check for priority changes
        let priorityChanged = false;
        for (const alert of activeAlerts) {
          const card = document.getElementById(`alert-${alert.id}`);
          if (card) {
            const currentPriority = card.getAttribute('data-priority');
            if (currentPriority !== alert.priority) {
              priorityChanged = true;
              break;
            }
          }
        }
        if (!priorityChanged) return;
      }
      
      // Something changed - reload the page
      window.location.reload();
    } catch(e) { 
      console.error('Poll error:', e); 
    }
  }

 function openAlertModal(element) {
    const title = element.getAttribute('data-title') || '';
    const message = element.getAttribute('data-message') || '';
    const type = element.getAttribute('data-type') || '';
    const location = element.getAttribute('data-location') || '';
    const priority = element.getAttribute('data-priority') || '';
    const date = element.getAttribute('data-date') || '';
    const latitude = parseFloat(element.getAttribute('data-latitude'));
    const longitude = parseFloat(element.getAttribute('data-longitude'));
    
    const priorityClass = getPriorityClass(priority);
    const priorityLabel = getPriorityLabel(priority);
    
    let dateFormatted = 'N/A';
    if (date) {
      try {
        dateFormatted = new Date(date).toLocaleString('en-PH');
      } catch(e) {}
    }
    
    const hasLocation = latitude && longitude && !isNaN(latitude) && !isNaN(longitude) && latitude !== 0 && longitude !== 0;
    
    const modalContent = document.getElementById('modalContent');
    if (!modalContent) return;
    
    modalContent.innerHTML = `
      <div class="modal-body-custom">
        <div style="text-align: center; margin-bottom: 16px;">
          <div style="background: ${priorityClass === 'critical' ? '#E35248' : priorityClass === 'warning' ? '#F2A03D' : '#2D9CDB'}; width: 60px; height: 60px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;">
            <i class="bi bi-exclamation-triangle-fill" style="font-size: 28px; color: white;"></i>
          </div>
        </div>
        <h3 style="font-family: var(--font-h); font-size: 18px; margin-bottom: 8px; text-align: center;">${escapeHtml(title)}</h3>
        <div style="text-align: center; margin-bottom: 16px;">
          <span style="background: ${priorityClass === 'critical' ? '#E35248' : priorityClass === 'warning' ? '#F2A03D' : '#2D9CDB'}; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700;">${priorityLabel}</span>
          <span style="margin-left: 8px; font-size: 12px; color: #888;">${escapeHtml(type)}</span>
        </div>
        <p style="font-size: 14px; line-height: 1.6; margin-bottom: 12px;">${escapeHtml(message)}</p>
        <div class="modal-location">
          <i class="bi bi-geo-alt-fill" style="color: #e74c3c;"></i>
          <span>${escapeHtml(location || 'San Sebastian, Kawit')}</span>
        </div>
        <div style="font-size: 11px; color: #888; margin-top: 8px;">
          <i class="bi bi-calendar3"></i> Created: ${escapeHtml(dateFormatted)}
        </div>
        ${hasLocation ? `<div id="modalMap" class="modal-map"></div>` : ''}
      </div>
      <div class="modal-footer-custom">
        <button class="btn-close-m" onclick="closeModal()">Close</button>
      </div>
    `;
    
    document.getElementById('overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    
    if (hasLocation) {
      setTimeout(() => {
        if (currentMap) currentMap.remove();
        const mapContainer = document.getElementById('modalMap');
        if (mapContainer) {
          const map = L.map('modalMap').setView([latitude, longitude], 14);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
          }).addTo(map);
          const redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41]
          });
          L.marker([latitude, longitude], { icon: redIcon }).addTo(map).bindPopup(`<b>${escapeHtml(title)}</b>`).openPopup();
          map.invalidateSize();
          currentMap = map;
        }
      }, 100);
    }
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow = '';
    if (currentMap) { currentMap.remove(); currentMap = null; }
  }

  function closeModalOnBg(e) {
    if (e.target === document.getElementById('overlay')) closeModal();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Tab switching - hide/show weather and filter the feed
  document.querySelectorAll('.sub-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      
      const weatherContent = document.getElementById('weatherContent');
      const alertsContent = document.getElementById('alertsContent');
      const sectionTitle = document.getElementById('activeSectionTitle');
      
      if (currentTab === 'weather') {
        if (weatherContent) weatherContent.style.display = 'block';
        if (alertsContent) alertsContent.style.display = 'none';
        fetchWeather();
      } else {
        if (weatherContent) weatherContent.style.display = 'none';
        if (alertsContent) alertsContent.style.display = 'block';
        
        // Filter the existing cards instead of rebuilding
        const cards = document.querySelectorAll('#feed .alert-card');
        let anyVisible = false;
        
        cards.forEach(card => {
          const type = card.getAttribute('data-type') || '';
          
          if (currentTab === 'road') {
            const show = type === 'Public Safety';
            card.style.display = show ? '' : 'none';
            if (show) anyVisible = true;
            if (sectionTitle) sectionTitle.textContent = 'Public Safety Advisories';
          } else {
            const show = type !== 'Public Safety';
            card.style.display = show ? '' : 'none';
            if (show) anyVisible = true;
            if (sectionTitle) sectionTitle.textContent = 'Emergency Alerts';
          }
        });
        
        const emptyState = document.getElementById('emptyState');
        if (emptyState) emptyState.style.display = anyVisible ? 'none' : 'block';
      }
    });
  });

  // Weather functions
  let weeklyForecast = [];
  let weatherData = null;
  let expandedDay = null;

  async function fetchWeather() {
    try {
      const lat = 14.4129;
      const lon = 120.8886;
      const response = await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&timezone=Asia%2FSingapore&forecast_days=7`
      );
      const data = await response.json();
      
      weatherData = {
        temp: Math.round(data.current.temperature_2m),
        code: data.current.weather_code
      };
      
      weeklyForecast = [];
      for (let i = 0; i < data.daily.time.length; i++) {
        const date = new Date(data.daily.time[i]);
        const dayName = date.toLocaleDateString('en-PH', { weekday: 'short' });
        const monthDay = date.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
        
        weeklyForecast.push({
          id: i,
          dayName,
          monthDay,
          maxTemp: Math.round(data.daily.temperature_2m_max[i]),
          minTemp: Math.round(data.daily.temperature_2m_min[i]),
          weatherCode: data.daily.weather_code[i],
          precipProb: data.daily.precipitation_probability_max[i],
        });
      }
      
      updateWeatherUI();
    } catch (error) {
      console.error("Weather fetch failed:", error);
    }
  }

  function getWeatherIconClass(code) {
    if (code === 0) return 'bi bi-sun';
    if (code === 1 || code === 2) return 'bi bi-cloud-sun';
    if (code === 3) return 'bi bi-cloud';
    if (code >= 45 && code <= 48) return 'bi bi-cloud-fog';
    if (code >= 51 && code <= 55) return 'bi bi-cloud-drizzle';
    if (code >= 61 && code <= 65) return 'bi bi-cloud-rain';
    if (code >= 71 && code <= 77) return 'bi bi-snow';
    if (code >= 80 && code <= 82) return 'bi bi-cloud-rain-heavy';
    if (code >= 95 && code <= 99) return 'bi bi-cloud-lightning-rain';
    return 'bi bi-cloud-sun';
  }

  function updateWeatherUI() {
    if (weatherData) {
      const iconClass = getWeatherIconClass(weatherData.code);
      const weatherIcon = document.querySelector('#weatherHeader .weather-icon i');
      if (weatherIcon) weatherIcon.className = iconClass;
      const currentTemp = document.getElementById('currentTemp');
      if (currentTemp) currentTemp.textContent = weatherData.temp + '°C';
    }
    
    const forecastContainer = document.getElementById('forecastList');
    if (forecastContainer && weeklyForecast.length) {
      forecastContainer.innerHTML = '';
      weeklyForecast.forEach((day, idx) => {
        const iconClass = getWeatherIconClass(day.weatherCode);
        const isExpanded = expandedDay === idx;
        const dayDiv = document.createElement('div');
        dayDiv.className = 'forecast-day';
        dayDiv.innerHTML = `
          <div class="forecast-header" onclick="toggleForecast(${idx})">
            <div class="day-info">
              <div class="day-name">${escapeHtml(day.dayName)}</div>
              <div class="day-date">${escapeHtml(day.monthDay)}</div>
            </div>
            <i class="${iconClass} weather-icon-small"></i>
            <div class="temp-range">
              <span class="temp-max">${day.maxTemp}°</span>
              <span class="temp-min">${day.minTemp}°</span>
            </div>
            <i class="bi bi-chevron-down"></i>
          </div>
          <div class="forecast-details" id="forecastDetails-${idx}" style="display: ${isExpanded ? 'block' : 'none'}">
            <div class="detail-row"><i class="bi bi-droplet"></i> Precipitation: ${day.precipProb}% chance</div>
            <div class="detail-row"><i class="bi bi-thermometer-half"></i> Feels like: ~${Math.round((day.maxTemp + day.minTemp) / 2)}°C average</div>
            <div class="detail-row"><i class="bi bi-wind"></i> ${day.precipProb > 70 ? 'High chance of rain' : day.precipProb > 40 ? 'Moderate chance of rain' : 'Low chance of rain'}</div>
          </div>
        `;
        forecastContainer.appendChild(dayDiv);
      });
    }
  }

  function toggleForecast(idx) {
    expandedDay = expandedDay === idx ? null : idx;
    updateWeatherUI();
  }

  // Start polling every 5 seconds - only reloads when data actually changes
  setInterval(pollAlerts, 5000);
  
  // Initial weather fetch
  fetchWeather();
</script>

</body>
</html>
