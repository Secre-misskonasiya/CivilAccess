<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Brgy. San Sebastian Barangay Services: Rent Assets, Reserve Court, and Request Documents">
    
    <!-- External CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Lato&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/sidebar2.css}">
    <link rel="stylesheet" href="/css/resident-document.css">

    <title>My Requests – CivilAccess</title>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/sidebar2 :: sidebar}"></div>
    <div th:replace="~{fragments/sidebar2 :: logoutModal}"></div>
    <div th:replace="~{fragments/sidebar2 :: mobileToggle}"></div>

    <div class="content" role="main">
        <nav class="topnav">
            <a class="nav-brand" href="#">
                <div class="nav-icon"><i class="bi bi-building-fill"></i></div>
                <div>
                    <div class="nav-name">CivilAccess</div>
                    <div class="nav-sub">Barangay Portal</div>
                </div>
            </a>
        </nav>

        <div class="action-row">
            <button class="action-btn" id="btnGoDocuments">
                <i class="bi bi-file-text"></i>
                <span>Documents</span>
            </button>
            <button class="action-btn" id="btnGoReserve">
                <i class="bi bi-calendar-check"></i>
                <span>Reserve Court</span>
            </button>
            <button class="action-btn" id="btnGoRent">
                <i class="bi bi-box-seam"></i>
                <span>Rent Equipment</span>
            </button>
        </div>

        <div class="tab-bar">
            <button class="tab active" data-tab="active">
                Active
            </button>
            <button class="tab" data-tab="ready">
                Ready
                <span class="tab-badge" id="readyBadge">0</span>
            </button>
            <button class="tab" data-tab="history">
                History
            </button>
        </div>

        <div class="requests-wrap" id="requestsWrap">
            <div class="loading">
                <i class="bi bi-arrow-clockwise"></i>
                Loading your requests…
            </div>
        </div>
    </div>
</div>

<!-- Modal Container -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-container">
        <div class="modal-header">
            <h2 id="modalTitle">Request Details</h2>
            <button class="modal-close" id="btnCloseModal">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- Content dynamically injected -->
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/resident-document.js"></script>
<script src="/js/sidebar2.js"></script>
</body>
</html>
