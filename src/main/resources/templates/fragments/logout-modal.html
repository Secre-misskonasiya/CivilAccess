<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="logoutModal" id="logoutModal" class="logout-modal-overlay">
    <div class="logout-modal-box">
        <h3 class="logout-modal-title">Confirm Logout</h3>
        <p class="logout-modal-text">Are you sure you want to log out?</p>
        <div class="logout-modal-actions">
            <button id="btnConfirmLogout" class="logout-btn-confirm">Logout</button>
            <button id="btnCancelLogout" class="logout-btn-cancel">Cancel</button>
        </div>
    </div>
</div>
</body>
</html>
